<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Leitor - Controle de Validade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Arial,sans-serif;background:#111;color:#fff;overflow-x:hidden}body{min-height:100dvh}.app{width:100%;max-width:700px;min-height:100dvh;margin:0 auto;position:relative;background:#111;overflow:hidden}.camera{position:fixed;inset:0;width:100%;height:100dvh;background:#111;overflow:hidden;z-index:1}#video{width:100%;height:100%;object-fit:cover;display:block}.camera:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.58) 0%,rgba(0,0,0,0) 25%,rgba(0,0,0,0) 58%,rgba(0,0,0,.76) 100%);pointer-events:none}.top{position:fixed;top:max(18px,env(safe-area-inset-top));left:0;right:0;z-index:20;text-align:center;pointer-events:none;padding:8px 70px}.logo{font-size:21px;font-weight:900;letter-spacing:-.5px;text-shadow:0 2px 8px #000}.subtitle{margin-top:4px;font-size:13px;color:rgba(255,255,255,.78);font-weight:700;text-shadow:0 2px 8px #000}.scan-area{position:fixed;z-index:10;left:10%;right:10%;top:34%;height:27%;border:3px solid rgba(255,255,255,.95);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.28);pointer-events:none}.scan-area:before,.scan-area:after{content:"";position:absolute;width:38px;height:38px;border-color:#ffd400;border-style:solid}.scan-area:before{left:-3px;top:-3px;border-width:6px 0 0 6px;border-radius:14px 0 0 0}.scan-area:after{right:-3px;bottom:-3px;border-width:0 6px 6px 0;border-radius:0 0 14px 0}.scan-line{position:fixed;z-index:11;left:11%;right:11%;top:47%;height:2px;background:#ffd400;box-shadow:0 0 10px #ffd400;animation:scan 1.8s infinite ease-in-out;pointer-events:none}@keyframes scan{0%,100%{transform:translateY(-30px)}50%{transform:translateY(105px)}}.camera-text{position:fixed;z-index:12;left:0;right:0;top:calc(61% + 8px);text-align:center;color:#fff;font-size:15px;font-weight:800;text-shadow:0 2px 8px #000;pointer-events:none}.fab-lista{position:fixed;z-index:50;top:max(18px,env(safe-area-inset-top));right:18px;width:48px;height:48px;border-radius:50%;background:rgba(17,17,17,.88);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:24px;box-shadow:0 4px 16px rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent;backdrop-filter:blur(6px)}.fab-lista:active{transform:scale(.94)}.bottom-panel{position:fixed;z-index:30;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));max-width:620px;margin:0 auto}.instruction{text-align:center;margin-bottom:11px}.instruction strong{display:block;font-size:22px;margin-bottom:3px;text-shadow:0 2px 8px #000}.instruction span{font-size:13px;color:rgba(255,255,255,.78);text-shadow:0 2px 8px #000}.manual{display:flex;gap:8px}.manual input{flex:1;min-width:0;height:52px;border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:0 15px;font-size:16px;outline:none;background:rgba(255,255,255,.94);color:#171717}.manual input::placeholder{color:#8d8d8d}.manual input:focus{border-color:#ffd400;box-shadow:0 0 0 3px rgba(255,212,0,.22)}.manual button{width:58px;height:52px;border:0;border-radius:14px;background:#ffd400;color:#111;font-size:17px;font-weight:900;cursor:pointer}.manual button:active{transform:scale(.96)}.status{min-height:22px;margin-top:7px;text-align:center;font-size:13px;font-weight:800;color:rgba(255,255,255,.86);text-shadow:0 2px 7px #000}.status.error{color:#ff9b9b}.status.success{color:#a6ffbe}.camera-button{position:fixed;z-index:50;top:max(18px,env(safe-area-inset-top));left:18px;width:48px;height:48px;border:0;border-radius:50%;background:rgba(17,17,17,.72);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.28);backdrop-filter:blur(6px)}.camera-button:active{transform:scale(.94)}button{ -webkit-tap-highlight-color:transparent;transition:transform .14s ease,filter .18s ease}button:hover{filter:brightness(1.04)}@media(max-width:380px){.logo{font-size:18px}.subtitle{font-size:12px}.scan-area{top:32%;height:25%}.camera-text{top:59%;font-size:14px}.instruction strong{font-size:19px}.bottom-panel{left:12px;right:12px}}
</style>
</head>
<body>
<div class="app">
<div class="camera"><video id="video" autoplay muted playsinline></video></div>
<div class="top"><div class="logo">CONTROLE DE VALIDADE</div><div class="subtitle">Leitor de produtos</div></div>
<div class="scan-area"></div><div class="scan-line"></div>
<div class="camera-text">Aponte para o código de barras</div>
<button id="cameraButton" class="camera-button" type="button" aria-label="Parar ou iniciar câmera" title="Câmera">📷</button>
<div class="bottom-panel">
<div class="instruction"><strong>Bipe o produto</strong><span>O produto será identificado automaticamente</span></div>
<div class="manual"><input id="manualCode" type="text" inputmode="numeric" autocomplete="off" placeholder="Digite o código de barras"><button id="manualButton" type="button">OK</button></div>
<div id="status" class="status">Abrindo câmera...</div>
</div></div>
<a class="fab-lista" href="lista_valididades.html" aria-label="Ver lista de validades" title="Ver lista">☷</a>
<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>
<script>
const ARQUIVO_TELA_PRODUTO="app_validade_estilo_beep_codigo.html";
const video=document.getElementById("video"),manualCode=document.getElementById("manualCode"),manualButton=document.getElementById("manualButton"),cameraButton=document.getElementById("cameraButton"),status=document.getElementById("status");
let scanner=null,scannerControls=null,ultimoCodigo="",iniciando=false;
function mostrarStatus(texto,tipo=""){status.textContent=texto;status.className="status "+tipo}
function normalizarCodigo(codigo){return String(codigo||"").replace(/\D/g,"").trim()}
function abrirTelaProduto(codigo){codigo=normalizarCodigo(codigo);if(!codigo){mostrarStatus("Digite ou leia um código válido.","error");manualCode.focus();return}pararCamera();mostrarStatus("Produto identificado!","success");window.location.href=ARQUIVO_TELA_PRODUTO+"?codigo="+encodeURIComponent(codigo)}
function beep(){try{const AudioContext=window.AudioContext||window.webkitAudioContext;if(!AudioContext)return;const ctx=new AudioContext(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=900;osc.type="sine";gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.01);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.12);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.13)}catch(e){}}
async function iniciarLeitura(){if(iniciando||scannerControls)return;iniciando=true;try{if(!window.ZXingBrowser||!ZXingBrowser.BrowserMultiFormatOneDReader)throw new Error("Leitor ZXing não carregado.");scanner=new ZXingBrowser.BrowserMultiFormatOneDReader(undefined,{delayBetweenScanSuccess:1000,delayBetweenScanAttempts:150});scannerControls=await scanner.decodeFromVideoDevice(undefined,video,function(result,error){if(!result)return;const codigo=normalizarCodigo(result.getText?result.getText():result.text);if(!codigo||codigo===ultimoCodigo)return;ultimoCodigo=codigo;beep();mostrarStatus("Código encontrado: "+codigo,"success");abrirTelaProduto(codigo)});mostrarStatus("Câmera pronta. Aponte para o código.")}catch(erro){console.error("Erro ao iniciar leitor:",erro);mostrarStatus("Não foi possível iniciar o leitor. Você pode digitar o código abaixo.","error")}finally{iniciando=false}}
function pararCamera(){try{if(scannerControls)scannerControls.stop()}catch(e){}scannerControls=null;try{if(scanner&&scanner.reset)scanner.reset()}catch(e){}scanner=null;if(video.srcObject){video.srcObject.getTracks().forEach(track=>track.stop());video.srcObject=null}cameraButton.textContent="📷"}
cameraButton.addEventListener("click",function(){if(scannerControls){pararCamera();mostrarStatus("Câmera parada. Toque na câmera para iniciar.");cameraButton.textContent="📷"}else{cameraButton.textContent="⏹";iniciarLeitura()}});
manualButton.addEventListener("click",()=>abrirTelaProduto(manualCode.value));
manualCode.addEventListener("keydown",event=>{if(event.key==="Enter"){event.preventDefault();abrirTelaProduto(manualCode.value)}});
window.addEventListener("load",function(){cameraButton.textContent="⏹";iniciarLeitura()});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&!scannerControls&&!iniciando)iniciarLeitura()});
</script>
</body>
</html>
