<script>
const byCode = new Map(PRODUCTS.map(p => [String(p.codigo), p]));
const productCache = new Map();

const KEY = 'validades_v2';
const PRODUTOS_KEY = 'produtos_cadastrados_v1';

function readProductCatalog(){
  try{
    const raw = localStorage.getItem(PRODUTOS_KEY);
    const value = raw ? JSON.parse(raw) : [];
    return Array.isArray(value) ? value : [];
  }catch(e){
    console.warn('Erro lendo catálogo de produtos:', e);
    return [];
  }
}

function saveProductToCatalog(codigo,nome){
  const code=normalize(codigo);
  const name=String(nome ?? '').trim();
  if(!code || !name) return;

  try{
    const catalog=readProductCatalog();
    const index=catalog.findIndex(
      p=>normalize(p.codigo)===code
    );

    if(index>=0){
      catalog[index]={
        ...catalog[index],
        codigo:code,
        nome:name
      };
    }else{
      catalog.push({
        codigo:code,
        nome:name
      });
    }

    localStorage.setItem(
      PRODUTOS_KEY,
      JSON.stringify(catalog)
    );
  }catch(e){
    console.warn(
      'Produto não pôde ser salvo no catálogo:',
      e
    );
  }
}


/* =========================================================
   BUSCA PRODUTO
   ========================================================= */

async function getProductByCode(codigo){
  const code=normalize(codigo);
  if(!code) return null;

  // 1) Cache da sessão
  const cached=productCache.get(code);

  if(cached){
    return cached;
  }

  // 2) Catálogo fixo
  const fixedProduct=byCode.get(code);

  if(fixedProduct){

    const localProduct={
      codigo:code,
      nome:fixedProduct.nome,
      foto_url:''
    };

    productCache.set(
      code,
      localProduct
    );

    // Busca dados atualizados em segundo plano
    supabaseClient
      .from('produtos')
      .select(
        'id,codigo_barras,nome,foto_url,ativo'
      )
      .eq('codigo_barras',code)
      .eq('ativo',true)
      .limit(1)
      .maybeSingle()
      .then(({data,error})=>{

        if(!error && data){

          productCache.set(
            code,
            {
              id:data.id,
              codigo:normalize(data.codigo_barras),
              nome:data.nome || localProduct.nome,
              foto_url:data.foto_url || ''
            }
          );

          // Se a tela ainda estiver mostrando este produto,
          // atualiza a foto automaticamente.
          if(
            selected &&
            normalize(selected.codigo)===code
          ){
            selected={
              id:data.id,
              codigo:normalize(data.codigo_barras),
              nome:data.nome || localProduct.nome,
              foto_url:data.foto_url || ''
            };

            renderProduct();
          }
        }

      })
      .catch(()=>{});

    return localProduct;
  }


  // 3) Catálogo local antigo
  const catalogProduct=readProductCatalog().find(
    p=>normalize(p.codigo)===code
  );

  if(
    catalogProduct &&
    catalogProduct.nome
  ){

    const localProduct={
      codigo:code,
      nome:catalogProduct.nome,
      foto_url:''
    };

    productCache.set(
      code,
      localProduct
    );

    return localProduct;
  }


  // 4) Supabase
  const {data,error}=await supabaseClient
    .from('produtos')
    .select(
      'id,codigo_barras,nome,foto_url,ativo'
    )
    .eq('codigo_barras',code)
    .eq('ativo',true)
    .limit(1)
    .maybeSingle();

  if(error){
    console.error(
      'Erro consultando o Supabase:',
      error
    );

    throw new Error(
      'Não foi possível consultar o cadastro de produtos.'
    );
  }

  if(data){

    const product={
      id:data.id,
      codigo:normalize(data.codigo_barras),
      nome:data.nome || '',
      foto_url:data.foto_url || ''
    };

    productCache.set(
      code,
      product
    );

    return product;
  }

  return null;
}


/* =========================================================
   UPLOAD DA FOTO
   ========================================================= */

async function uploadProductPhoto(file,produtoId){

  if(!file || !produtoId){
    return '';
  }

  // Verifica tamanho
  if(file.size > 10 * 1024 * 1024){
    throw new Error(
      'A foto é muito grande. Escolha uma imagem de até 10 MB.'
    );
  }

  // Descobre extensão
  let extension=
    (file.name.split('.').pop() || 'jpg')
      .toLowerCase()
      .replace(/[^a-z0-9]/g,'');

  const allowedExtensions=[
    'jpg',
    'jpeg',
    'png',
    'webp',
    'gif'
  ];

  if(
    !allowedExtensions.includes(extension)
  ){
    extension='jpg';
  }

  /*
    Cada produto terá seu próprio arquivo.

    Exemplo:

    fotos_produtos/
      produtos/
        157.jpg
  */

  const filePath=
    `produtos/${produtoId}.${extension}`;


  /* -------------------------------------------------------
     Se já existe uma foto com outra extensão,
     tentamos remover versões antigas.
     ------------------------------------------------------- */

  const possibleFiles=[
    'jpg',
    'jpeg',
    'png',
    'webp',
    'gif'
  ].map(
    ext=>`produtos/${produtoId}.${ext}`
  );

  try{

    await supabaseClient
      .storage
      .from('fotos_produtos')
      .remove(possibleFiles);

  }catch(e){

    // Não impede o novo upload
    console.warn(
      'Não foi possível remover fotos antigas:',
      e
    );
  }


  /* -------------------------------------------------------
     Upload
     ------------------------------------------------------- */

  const {
    error:uploadError
  } = await supabaseClient
    .storage
    .from('fotos_produtos')
    .upload(
      filePath,
      file,
      {
        upsert:true,
        cacheControl:'31536000',
        contentType:
          file.type ||
          (
            extension==='jpg'
              ? 'image/jpeg'
              : `image/${extension}`
          )
      }
    );


  if(uploadError){

    console.error(
      'Erro ao enviar foto:',
      uploadError
    );

    throw new Error(
      'Não foi possível enviar a foto: '+
      uploadError.message
    );
  }


  /* -------------------------------------------------------
     URL pública
     ------------------------------------------------------- */

  const {
    data:publicData
  } = supabaseClient
    .storage
    .from('fotos_produtos')
    .getPublicUrl(filePath);


  if(
    !publicData ||
    !publicData.publicUrl
  ){
    throw new Error(
      'Não foi possível obter o endereço da foto.'
    );
  }


  /*
    Adicionamos uma versão para evitar
    que o navegador mostre a foto antiga
    em cache.
  */

  return (
    publicData.publicUrl+
    '?v='+Date.now()
  );
}


/* =========================================================
   VARIÁVEIS
   ========================================================= */

let selected=null;

const $=id=>
  document.getElementById(id);


function msg(
  text,
  type='ok'
){

  $('message').innerHTML=
    text
      ? `<div class="msg ${type}">${text}</div>`
      : '';
}


function normalize(code){

  return String(
    code ?? ''
  ).replace(/\D/g,'');
}


function esc(s){

  return String(
    s ?? ''
  ).replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[m])
  );
}


/* =========================================================
   BUSCAR
   ========================================================= */

async function find(code){

  const c=normalize(code);

  if(!c){

    msg(
      'Código de barras inválido.',
      'err'
    );

    return;
  }

  try{

    msg(
      'Consultando produto...',
      ''
    );

    const product=
      await getProductByCode(c);

    selected=
      product ||
      {
        codigo:c,
        nome:'',
        foto_url:''
      };

    renderProduct();

  }catch(e){

    console.error(
      'Erro ao buscar produto:',
      e
    );

    msg(
      e.message ||
      'Erro ao consultar o produto.',
      'err'
    );
  }
}


/* =========================================================
   USUÁRIO / LOJAS
   ========================================================= */

let currentUsuario=null;
let lojasDisponiveis=[];


async function carregarContextoUsuario(){

  const {
    data:{session},
    error:sessionError
  } =
    await supabaseClient
      .auth
      .getSession();


  if(
    sessionError ||
    !session
  ){

    window.location.replace(
      'login.html'
    );

    throw new Error(
      'Sessão não encontrada.'
    );
  }


  const {
    data:usuario,
    error:usuarioError
  } =
    await supabaseClient
      .from('usuarios')
      .select(
        'id,loja_id,perfil,nome,ativo'
      )
      .eq(
        'auth_user_id',
        session.user.id
      )
      .maybeSingle();


  if(usuarioError){

    throw new Error(
      'Não foi possível identificar o usuário: '+
      usuarioError.message
    );
  }


  if(
    !usuario ||
    usuario.ativo===false
  ){

    throw new Error(
      'Usuário não encontrado ou inativo.'
    );
  }


  currentUsuario=usuario;


  if(
    usuario.perfil==='gerente_geral' ||
    usuario.perfil==='admin_global'
  ){

    const {
      data:lojas,
      error:lojasError
    } =
      await supabaseClient
        .from('lojas')
        .select(
          'id,nome,ativo'
        )
        .eq(
          'ativo',
          true
        )
        .order('nome');


    if(lojasError){

      throw new Error(
        'Não foi possível carregar as lojas: '+
        lojasError.message
      );
    }


    lojasDisponiveis=
      lojas || [];

  }else{

    lojasDisponiveis=[];
  }
}


/* =========================================================
   RENDERIZA PRODUTO
   ========================================================= */

function renderProduct(){

  const p=selected;

  const isNew=!p.nome;

  const savedPhoto=
    p.foto_url || '';


  $('productCard')
    .classList
    .remove('hidden');


  $('productCard').innerHTML=`

    ${
      savedPhoto

      ?

      `<img
        class="product-photo"
        src="${esc(savedPhoto)}"
        alt="Foto do produto"
        loading="eager"
        decoding="async"
      >`

      :

      `<div class="no-photo">
        📦
        <span>
          ${
            isNew
              ? 'Adicionar foto do produto'
              : 'Foto ainda não cadastrada'
          }
        </span>
      </div>`
    }


    <div class="product-name">
      ${
        isNew
          ? 'Produto novo'
          : esc(p.nome)
      }
    </div>


    <div class="product-code">
      ${esc(p.codigo)}
    </div>


    ${
      isNew

      ?

      `
      <div class="new-label">
        Nome do produto
      </div>

      <input
        id="newName"
        autocomplete="off"
        placeholder="Digite o nome do produto"
      >
      `

      :

      ''
    }


    <div
      style="margin-top:${isNew?'14px':'0'}"
    >

      <div class="date-label">
        VALIDADE
      </div>

      <input
        id="date"
        class="date-input"
        type="date"
      >

    </div>


    ${
      (
        currentUsuario &&
        [
          'gerente_geral',
          'admin_global'
        ].includes(
          currentUsuario.perfil
        )
      )

      ?

      `
      <div class="store-select-wrap">

        <label
          for="storeSelect"
        >
          Loja onde esta validade será cadastrada
        </label>

        <select id="storeSelect">

          <option value="">
            Selecione a loja
          </option>

          ${
            lojasDisponiveis
              .map(
                l=>
                  `<option value="${l.id}">
                    ${esc(l.nome)}
                  </option>`
              )
              .join('')
          }

        </select>

      </div>
      `

      :

      ''
    }


    <div class="photo-actions">

      <span class="muted">
        ${
          savedPhoto
            ? 'Foto cadastrada'
            : 'Sem foto'
        }
      </span>


      <label
        class="photo-btn"
        for="photo"
      >
        📷 ${
          savedPhoto
            ? 'Trocar foto'
            : 'Adicionar foto'
        }
      </label>


      <input
        id="photo"
        class="hidden"
        type="file"
        accept="image/*"
        capture="environment"
      >

    </div>


    <button
      id="saveBtn"
      class="save"
      type="button"
      onclick="registerProduct()"
    >
      ${
        isNew
          ? 'SALVAR PRODUTO'
          : 'SALVAR VALIDADE'
      }
    </button>


    <button
      class="cancel"
      type="button"
      onclick="cancelProduct()"
    >
      Cancelar
    </button>
  `;


  const date=$('date');


  if(isNew){

    $('newName').focus();

  }else{

    date.focus();

  }


  date.addEventListener(
    'keydown',
    e=>{

      if(
        e.key==='Enter'
      ){

        registerProduct();

      }

    }
  );


  /* Mostra imediatamente o nome do arquivo escolhido */

  const photoInput=$('photo');

  if(photoInput){

    photoInput.addEventListener(
      'change',
      ()=>{

        const file=
          photoInput.files[0];

        if(!file) return;

        const photoStatus=
          document.querySelector(
            '.photo-actions .muted'
          );

        if(photoStatus){

          photoStatus.textContent=
            'Foto selecionada';

        }

      }
    );

  }
}


/* =========================================================
   CANCELAR
   ========================================================= */

function cancelProduct(){

  window.location.href=
    'leitor.html';

}


/* =========================================================
   SALVAR
   ========================================================= */

async function registerProduct(){

  try{

    if(!selected){

      msg(
        'Nenhum produto selecionado.',
        'err'
      );

      return;
    }


    const dateEl=$('date');

    const date=
      dateEl
        ? dateEl.value
        : '';


    const isNew=
      !selected.nome;


    const name=
      selected.nome ||
      (
        $('newName') &&
        $('newName').value
          ? $('newName').value
          : ''
      ).trim();


    if(
      isNew &&
      !name
    ){

      msg(
        'Digite o nome do produto.',
        'err'
      );

      if($('newName')){
        $('newName').focus();
      }

      return;
    }


    if(!date){

      msg(
        'Informe a validade.',
        'err'
      );

      if(dateEl){
        dateEl.focus();
      }

      return;
    }


    /* -------------------------------------------------------
       LOJA
       ------------------------------------------------------- */

    let lojaId=
      currentUsuario
        ? currentUsuario.loja_id
        : null;


    if(
      currentUsuario &&
      [
        'gerente_geral',
        'admin_global'
      ].includes(
        currentUsuario.perfil
      )
    ){

      const storeEl=
        $('storeSelect');


      lojaId=
        storeEl
          ? storeEl.value
          : '';


      if(!lojaId){

        msg(
          'Selecione a loja onde esta validade será cadastrada.',
          'err'
        );

        if(storeEl){
          storeEl.focus();
        }

        return;
      }
    }


    if(!lojaId){

      msg(
        'Usuário sem loja vinculada.',
        'err'
      );

      return;
    }


    /* -------------------------------------------------------
       BOTÃO
       ------------------------------------------------------- */

    const code=
      normalize(
        selected.codigo
      );


    const saveBtn=
      $('saveBtn');


    if(saveBtn){

      saveBtn.disabled=true;

      saveBtn.textContent=
        'SALVANDO...';
    }


    msg(
      'Salvando validade...',
      ''
    );


    /* -------------------------------------------------------
       SESSÃO + PRODUTO EM PARALELO
       ------------------------------------------------------- */

    const sessionPromise=
      supabaseClient
        .auth
        .getSession();


    const cachedProduct=
      productCache.get(code);


    const [
      {
        data:sessionData,
        error:sessionError
      },
      productResult
    ] =
      await Promise.all([

        sessionPromise,

        cachedProduct?.id

          ?

          Promise.resolve({
            data:{
              id:cachedProduct.id,
              codigo_barras:
                cachedProduct.codigo,
              nome:
                cachedProduct.nome,
              foto_url:
                cachedProduct.foto_url || '',
              ativo:true
            },
            error:null
          })

          :

          supabaseClient
            .from('produtos')
            .select(
              'id,codigo_barras,nome,foto_url,ativo'
            )
            .eq(
              'codigo_barras',
              code
            )
            .eq(
              'ativo',
              true
            )
            .limit(1)
            .maybeSingle()

      ]);


    if(
      sessionError ||
      !sessionData.session
    ){

      window.location.replace(
        'login.html'
      );

      return;
    }


    const usuario=
      currentUsuario;


    if(!usuario){

      throw new Error(
        'Não foi possível identificar o usuário.'
      );
    }


    let {
      data:produto,
      error:produtoError
    } =
      productResult;


    if(produtoError){

      throw new Error(
        'Não foi possível localizar o produto: '+
        produtoError.message
      );
    }


    /* -------------------------------------------------------
       CRIA PRODUTO SE FOR NOVO
       ------------------------------------------------------- */

    if(!produto){

      const {
        data:novoProduto,
        error:novoProdutoError
      } =
        await supabaseClient
          .from('produtos')
          .insert({
            codigo_barras:code,
            nome:name,
            ativo:true
          })
          .select(
            'id,codigo_barras,nome,foto_url,ativo'
          )
          .single();


      if(novoProdutoError){

        throw new Error(
          'Não foi possível cadastrar o produto: '+
          novoProdutoError.message
        );
      }


      produto=
        novoProduto;


      productCache.set(
        code,
        {
          id:novoProduto.id,
          codigo:code,
          nome:
            novoProduto.nome ||
            name,
          foto_url:
            novoProduto.foto_url ||
            ''
        }
      );


    }else{

      productCache.set(
        code,
        {
          id:produto.id,
          codigo:code,
          nome:
            produto.nome ||
            name,
          foto_url:
            produto.foto_url ||
            ''
        }
      );

    }


    /* -------------------------------------------------------
       FOTO
       ------------------------------------------------------- */

    const file=
      $('photo') &&
      $('photo').files[0];


    if(file){

      if(saveBtn){

        saveBtn.textContent=
          'ENVIANDO FOTO...';

      }


      msg(
        'Enviando foto...',
        ''
      );


      const fotoUrl=
        await uploadProductPhoto(
          file,
          produto.id
        );


      /* Atualiza produtos.foto_url */

      const {
        error:fotoError
      } =
        await supabaseClient
          .from('produtos')
          .update({
            foto_url:fotoUrl
          })
          .eq(
            'id',
            produto.id
          );


      if(fotoError){

        throw new Error(
          'A foto foi enviada, mas não foi possível vinculá-la ao produto: '+
          fotoError.message
        );
      }


      /* Atualiza objeto atual */

      produto.foto_url=
        fotoUrl;


      productCache.set(
        code,
        {
          id:produto.id,
          codigo:code,
          nome:
            produto.nome ||
            name,
          foto_url:
            fotoUrl
        }
      );

    }


    /* -------------------------------------------------------
       VERIFICA VALIDADE DUPLICADA
       ------------------------------------------------------- */

    if(saveBtn){

      saveBtn.textContent=
        'VERIFICANDO...';

    }


    const {
      data:existente,
      error:existenteError
    } =
      await supabaseClient
        .from('validades')
        .select('id')
        .eq(
          'produto_id',
          produto.id
        )
        .eq(
          'loja_id',
          lojaId
        )
        .eq(
          'validade',
          date
        )
        .limit(1)
        .maybeSingle();


    if(existenteError){

      throw new Error(
        'Não foi possível verificar a validade: '+
        existenteError.message
      );
    }


    if(existente){

      msg(
        'Essa validade já foi cadastrada para este produto nesta loja.',
        'err'
      );


      if(saveBtn){

        saveBtn.disabled=false;

        saveBtn.textContent=
          (
            selected &&
            !selected.nome
          )
            ? 'SALVAR PRODUTO'
            : 'SALVAR VALIDADE';

      }

      return;
    }


    /* -------------------------------------------------------
       SALVA VALIDADE
       ------------------------------------------------------- */

    if(saveBtn){

      saveBtn.textContent=
        'SALVANDO VALIDADE...';

    }


    const {
      error:validadeError
    } =
      await supabaseClient
        .from('validades')
        .insert({
          produto_id:produto.id,
          loja_id:lojaId,
          validade:date,
          cadastrado_por:usuario.id
        });


    if(validadeError){

      throw new Error(
        'Não foi possível salvar a validade: '+
        validadeError.message
      );
    }


    /* -------------------------------------------------------
       FINAL
       ------------------------------------------------------- */

    window.location.href=
      'lista_valididades.html';


  }catch(e){

    console.error(
      'ERRO AO SALVAR NO SUPABASE:',
      e
    );


    msg(
      'Erro ao salvar: '+
      (
        e.message ||
        'verifique as permissões.'
      ),
      'err'
    );


    const saveBtn=
      $('saveBtn');


    if(saveBtn){

      saveBtn.disabled=false;

      saveBtn.textContent=
        (
          selected &&
          !selected.nome
        )
          ? 'SALVAR PRODUTO'
          : 'SALVAR VALIDADE';
    }

  }
}


/* =========================================================
   ABRIR PELO CÓDIGO DA URL
   ========================================================= */

function openFromUrl(){

  const codigo=
    new URLSearchParams(
      window.location.search
    ).get('codigo');


  if(codigo){

    find(codigo);

  }else{

    window.location.href=
      'leitor.html';

  }
}


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

(async function iniciarTela(){

  try{

    await carregarContextoUsuario();

    openFromUrl();

  }catch(e){

    console.error(e);

    msg(
      'Não foi possível carregar os dados do usuário.',
      'err'
    );

  }

})();


/* =========================================================
   MICROINTERAÇÕES
   ========================================================= */

(function(){

  document.addEventListener(
    'click',
    function(e){

      const target=
        e.target.closest(
          'button, .fab'
        );


      if(!target) return;


      const rect=
        target.getBoundingClientRect();


      const size=
        Math.max(
          rect.width,
          rect.height
        ) * .45;


      const ripple=
        document.createElement(
          'span'
        );


      ripple.className=
        'ripple';


      ripple.style.width=
        ripple.style.height=
          size+'px';


      ripple.style.left=
        (
          e.clientX -
          rect.left -
          size/2
        )+'px';


      ripple.style.top=
        (
          e.clientY -
          rect.top -
          size/2
        )+'px';


      target.appendChild(
        ripple
      );


      setTimeout(
        ()=>ripple.remove(),
        520
      );

    },
    true
  );


  document
    .querySelectorAll('input')
    .forEach(
      function(input){

        input.addEventListener(
          'focus',
          function(){

            this.classList.add(
              'pop-in'
            );

          }
        );

      }
    );

})();
</script>
