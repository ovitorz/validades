<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Cadastro de Validade</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f7f8;color:#171717}
.app{max-width:520px;margin:auto;min-height:100vh;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
.logo{font-size:20px;font-weight:900}
.counter{font-size:13px;color:#737373}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 2px 14px rgba(0,0,0,.07);margin-bottom:12px}
.manual{display:flex;gap:8px;margin-top:10px}
.manual input{flex:1}
button,input{font:inherit}
input{width:100%;padding:15px;border:1px solid #d7d7d7;border-radius:14px;background:#fff;outline:none}
input:focus{border-color:#171717;box-shadow:0 0 0 3px rgba(0,0,0,.07)}
.manual button{width:58px;border:0;border-radius:14px;background:#e9e9e9;font-weight:900}
.hidden{display:none!important}
.product-photo{width:100%;height:250px;object-fit:contain;background:#f2f2f2;border-radius:18px;margin-bottom:12px}
.no-photo{height:250px;border-radius:18px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#8a8a8a;margin-bottom:12px;font-size:48px}
.no-photo span{font-size:14px;font-weight:700;margin-top:7px}
.product-name{font-size:23px;font-weight:900;line-height:1.15;margin:2px 0 5px}
.product-code{font-size:13px;color:#777;margin-bottom:16px}
.date-label{font-size:13px;font-weight:800;color:#555;margin-bottom:7px}
.date-input{font-size:20px;font-weight:800;height:58px}
.store-select-wrap{margin-top:14px}
.store-select-wrap label{display:block;font-size:13px;font-weight:800;color:#555;margin-bottom:7px}
.store-select-wrap select{width:100%;height:58px;padding:0 14px;border:1px solid #d7d7d7;border-radius:14px;background:#fff;font:inherit;font-size:16px;font-weight:700;outline:none}
.store-select-wrap select:focus{border-color:#171717;box-shadow:0 0 0 3px rgba(0,0,0,.07)}

.photo-actions{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.photo-btn{border:0;background:#eeeeee;border-radius:12px;padding:11px 14px;font-weight:800}
.save{width:100%;height:60px;border:0;border-radius:16px;background:#171717;color:#fff;font-size:18px;font-weight:900;margin-top:14px}
.cancel{width:100%;border:0;background:transparent;color:#777;font-weight:800;padding:12px;margin-top:4px}
.new-label{font-size:13px;font-weight:800;color:#555;margin-bottom:7px}
.msg{padding:12px 14px;border-radius:14px;font-weight:800;margin-bottom:10px}
.ok{background:#eaf8ef;color:#126b37}
.err{background:#fff0f0;color:#a32626}
.list-title{font-size:17px;font-weight:900;margin:4px 2px 10px}
.item{display:flex;justify-content:space-between;gap:10px;padding:13px 2px;border-bottom:1px solid #eee}
.item:last-child{border-bottom:0}
.item b{display:block}
.muted{color:#777;font-size:13px}

  .list-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .list-open{border:0;background:#222;color:#fff;border-radius:10px;padding:8px 11px;font-size:11px;font-weight:700;cursor:pointer}
  .list-open:active{transform:scale(.98)}

  .lista-link-area{
    width:100%;
    display:flex;
    justify-content:center;
    padding:6px 20px 28px;
  }
  .btn-lista{
    border:0;
    background:transparent;
    color:#555;
    font-size:13px;
    font-weight:600;
    padding:10px 16px;
    cursor:pointer;
  }
  .btn-lista:active{opacity:.65}



  /* BOTÃO FLUTUANTE - LISTA */
  .fab-lista{
    position:fixed;
    right:max(18px, calc((100vw - 520px) / 2 + 18px));
    bottom:max(18px, env(safe-area-inset-bottom));
    width:58px;
    height:58px;
    border-radius:50%;
    background:#171717;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:24px;
    box-shadow:0 5px 18px rgba(0,0,0,.20);
    z-index:1000;
    -webkit-tap-highlight-color:transparent;
  }
  .fab-lista:active{transform:scale(.94)}


/* reforço: botão de salvar sempre clicável */
.save{position:relative;z-index:5;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}

/* ===== Microinterações ===== */
button, .fab, .item[role="button"] {
  -webkit-tap-highlight-color: transparent;
}
button, .fab {
  position: relative;
  overflow: hidden;
  transition: transform .16s ease, box-shadow .2s ease, filter .2s ease, background-color .2s ease;
}
button:hover, .fab:hover {
  transform: translateY(-2px);
  filter: brightness(1.03);
}
button:active, .fab:active {
  transform: translateY(1px) scale(.97);
  filter: brightness(.96);
}
button:focus-visible, .fab:focus-visible {
  outline: 3px solid rgba(0,0,0,.16);
  outline-offset: 3px;
}
input {
  transition: border-color .2s ease, box-shadow .2s ease, transform .15s ease;
}
input:focus {
  transform: translateY(-1px);
  box-shadow: 0 0 0 3px rgba(0,0,0,.07);
}
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,.38);
  transform: scale(0);
  animation: ripple .48s ease-out;
  pointer-events: none;
}
@keyframes ripple { to { transform: scale(3.2); opacity: 0; } }
.item[role="button"] {
  cursor: pointer;
  transition: transform .16s ease, background-color .2s ease, box-shadow .2s ease;
}
.item[role="button"]:hover {
  transform: translateY(-2px);
  background: rgba(0,0,0,.018);
}
.item[role="button"]:active {
  transform: scale(.985);
}
.pop-in { animation: popIn .28s ease both; }
@keyframes popIn { from { opacity:0; transform: translateY(7px) scale(.985); } to { opacity:1; transform:none; } }
.success-pop { animation: successPop .55s ease both; }
@keyframes successPop { 0%{transform:scale(.98);opacity:.7} 45%{transform:scale(1.015)} 100%{transform:scale(1);opacity:1} }

</style></head><body>

const byCode = new Map(PRODUCTS.map(p => [String(p.codigo), p]));
const productCache = new Map();
const KEY = 'validades_v2';
const PHOTOS = 'fotos_produtos_v2';
const PRODUTOS_KEY = 'produtos_cadastrados_v1';

function readProductCatalog(){
  try{
    const raw = localStorage.getItem(PRODUTOS_KEY);
    const value = raw ? JSON.parse(raw) : [];
    return Array.isArray(value) ? value : [];
  }catch(e){
    console.warn('Erro lendo catálogo de produtos:', e);
    return [];
  }
}

function saveProductToCatalog(codigo,nome){
  const code=normalize(codigo);
  const name=String(nome ?? '').trim();
  if(!code || !name) return;

  try{
    const catalog=readProductCatalog();
    const index=catalog.findIndex(p=>normalize(p.codigo)===code);

    if(index>=0){
      catalog[index]={...catalog[index],codigo:code,nome:name};
    }else{
      catalog.push({codigo:code,nome:name});
    }

    localStorage.setItem(PRODUTOS_KEY,JSON.stringify(catalog));
  }catch(e){
    console.warn('Produto não pôde ser salvo no catálogo:', e);
  }
}

async function getProductByCode(codigo){
  const code=normalize(codigo);
  if(!code) return null;

  // 1) Cache da sessão: elimina consultas repetidas durante o uso.
  const cached=productCache.get(code);
  if(cached) return cached;

  // 2) Catálogo fixo: mostra o produto imediatamente, sem esperar a rede.
  const fixedProduct=byCode.get(code);
  if(fixedProduct){
    const localProduct={codigo:code,nome:fixedProduct.nome,foto_url:''};
    productCache.set(code,localProduct);

    // Busca os dados completos em segundo plano (foto/nome atualizados).
    supabaseClient
      .from('produtos')
      .select('id,codigo_barras,nome,foto_url,ativo')
      .eq('codigo_barras',code)
      .eq('ativo',true)
      .limit(1)
      .maybeSingle()
      .then(({data,error})=>{
        if(!error && data){
          productCache.set(code,{
            id:data.id,
            codigo:normalize(data.codigo_barras),
            nome:data.nome || localProduct.nome,
            foto_url:data.foto_url || ''
          });
        }
      })
      .catch(()=>{});
    return localProduct;
  }

  // 3) Catálogo local antigo.
  const catalogProduct=readProductCatalog().find(
    p=>normalize(p.codigo)===code
  );
  if(catalogProduct && catalogProduct.nome){
    const localProduct={codigo:code,nome:catalogProduct.nome,foto_url:''};
    productCache.set(code,localProduct);
    return localProduct;
  }

  // 4) Supabase para produtos que não estão nos catálogos locais.
  const {data,error}=await supabaseClient
    .from('produtos')
    .select('id,codigo_barras,nome,foto_url,ativo')
    .eq('codigo_barras',code)
    .eq('ativo',true)
    .limit(1)
    .maybeSingle();

  if(error){
    console.error('Erro consultando o Supabase:',error);
    throw new Error('Não foi possível consultar o cadastro de produtos.');
  }

  if(data){
    const product={
      id:data.id,
      codigo:normalize(data.codigo_barras),
      nome:data.nome || '',
      foto_url:data.foto_url || ''
    };
    productCache.set(code,product);
    return product;
  }

  return null;
}

let selected = null;
const $ = id => document.getElementById(id);
function msg(text,type='ok'){
  $('message').innerHTML = text ? `<div class="msg ${type}">${text}</div>` : '';
}
function readRecords(){
  try {
    const raw = localStorage.getItem(KEY);
    if(!raw) return [];
    const value = JSON.parse(raw);
    return Array.isArray(value) ? value : [];
  } catch(e) {
    console.error('Erro lendo registros:',e);
    return [];
  }
}
function normalize(code){ return String(code ?? '').replace(/\D/g,''); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
async function find(code){
  const c=normalize(code);
  if(!c){ msg('Código de barras inválido.','err'); return; }

  try{
    msg('Consultando produto...','');
    const product=await getProductByCode(c);
    selected=product || {codigo:c,nome:''};
    renderProduct();
  }catch(e){
    console.error('Erro ao buscar produto:',e);
    msg(e.message || 'Erro ao consultar o produto.','err');
  }
}

let currentUsuario = null;
let lojasDisponiveis = [];

async function carregarContextoUsuario(){
  const {data:{session},error:sessionError}=await supabaseClient.auth.getSession();
  if(sessionError || !session){
    window.location.replace('login.html');
    throw new Error('Sessão não encontrada.');
  }

  const {data:usuario,error:usuarioError}=await supabaseClient
    .from('usuarios')
    .select('id,loja_id,perfil,nome,ativo')
    .eq('auth_user_id',session.user.id)
    .maybeSingle();

  if(usuarioError) throw new Error('Não foi possível identificar o usuário: '+usuarioError.message);
  if(!usuario || usuario.ativo === false) throw new Error('Usuário não encontrado ou inativo.');

  currentUsuario=usuario;

  if(usuario.perfil === 'gerente_geral' || usuario.perfil === 'admin_global'){
    const {data:lojas,error:lojasError}=await supabaseClient
      .from('lojas')
      .select('id,nome,ativo')
      .eq('ativo',true)
      .order('nome');

    if(lojasError) throw new Error('Não foi possível carregar as lojas: '+lojasError.message);
    lojasDisponiveis=lojas || [];
  }else{
    lojasDisponiveis=[];
  }
}

    <div class="product-name">${isNew?'Produto novo':esc(p.nome)}</div>
    <div class="product-code">${esc(p.codigo)}</div>
    ${isNew ? `<div class="new-label">Nome do produto</div><input id="newName" autocomplete="off" placeholder="Digite o nome do produto">` : ''}
    <div style="margin-top:${isNew?'14px':'0'}"><div class="date-label">VALIDADE</div><input id="date" class="date-input" type="date"></div>
    ${(currentUsuario && ['gerente_geral','admin_global'].includes(currentUsuario.perfil)) ? `
      <div class="store-select-wrap">
        <label for="storeSelect">Loja onde esta validade será cadastrada</label>
        <select id="storeSelect">
          <option value="">Selecione a loja</option>
          ${lojasDisponiveis.map(l => `<option value="${l.id}">${esc(l.nome)}</option>`).join('')}
        </select>
      </div>` : ''}
    <div class="photo-actions"><span class="muted">${savedPhoto?'Foto cadastrada':'Sem foto'}</span><label class="photo-btn" for="photo">📷 ${savedPhoto?'Trocar foto':'Adicionar foto'}</label><input id="photo" class="hidden" type="file" accept="image/*" capture="environment"></div>
    <button id="saveBtn" class="save" type="button" onclick="registerProduct()">SALVAR PRODUTO</button>
    <button class="cancel" type="button" onclick="cancelProduct()">Cancelar</button>`;
  const date=$('date');
  if(isNew) $('newName').focus(); else date.focus();
  date.addEventListener('keydown',e=>{if(e.key==='Enter') registerProduct();});
}
function cancelProduct(){ window.location.href='leitor.html'; }
async function registerProduct(){
  try {
    if(!selected) { msg('Nenhum produto selecionado.','err'); return; }
    const dateEl=$('date');
    const date=dateEl ? dateEl.value : '';
    const name=selected.nome || (($('newName') && $('newName').value) || '').trim();
    if(!name){ msg('Digite o nome do produto.','err'); if($('newName')) $('newName').focus(); return; }
    if(!date){ msg('Informe a validade.','err'); if(dateEl) dateEl.focus(); return; }

    let lojaId = currentUsuario ? currentUsuario.loja_id : null;
    if(currentUsuario && ['gerente_geral','admin_global'].includes(currentUsuario.perfil)){
      const storeEl=$('storeSelect');
      lojaId=storeEl ? storeEl.value : '';
      if(!lojaId){
        msg('Selecione a loja onde esta validade será cadastrada.','err');
        if(storeEl) storeEl.focus();
        return;
      }
    }

    if(!lojaId){
      msg('Usuário sem loja vinculada.','err');
      return;
    }

    const code=normalize(selected.codigo);
    const saveBtn=$('saveBtn');
    if(saveBtn){ saveBtn.disabled=true; saveBtn.textContent='SALVANDO...'; }
    msg('Salvando validade...','');

    // Sessão/usuário e produto podem ser consultados em paralelo.
    const sessionPromise=supabaseClient.auth.getSession();
    const cachedProduct=productCache.get(code);

    const [{data:sessionData,error:sessionError},
           productResult] = await Promise.all([
      sessionPromise,
      cachedProduct?.id
        ? Promise.resolve({data:{
            id:cachedProduct.id,
            codigo_barras:cachedProduct.codigo,
            nome:cachedProduct.nome,
            foto_url:cachedProduct.foto_url || '',
            ativo:true
          },error:null})
        : supabaseClient
            .from('produtos')
            .select('id,codigo_barras,nome,foto_url,ativo')
            .eq('codigo_barras',code)
            .eq('ativo',true)
            .limit(1)
            .maybeSingle()
    ]);

    if(sessionError || !sessionData.session){
      window.location.replace('login.html');
      return;
    }

    const usuario=currentUsuario;
    if(!usuario) throw new Error('Não foi possível identificar o usuário.');

    let {data:produto,error:produtoError}=productResult;
    if(produtoError) throw new Error('Não foi possível localizar o produto: '+produtoError.message);

    // Se for produto novo, cadastra primeiro na tabela produtos.
    if(!produto){
      const { data: novoProduto, error: novoProdutoError } = await supabaseClient
        .from('produtos')
        .insert({codigo_barras:code,nome:name,ativo:true})
        .select('id,codigo_barras,nome,foto_url,ativo')
        .single();

      if(novoProdutoError) throw new Error('Não foi possível cadastrar o produto: '+novoProdutoError.message);
      produto=novoProduto;
      productCache.set(code,{
        id:novoProduto.id,
        codigo:code,
        nome:novoProduto.nome || name,
        foto_url:novoProduto.foto_url || ''
      });
    }else{
      productCache.set(code,{
        id:produto.id,
        codigo:code,
        nome:produto.nome || name,
        foto_url:produto.foto_url || ''
      });
    }

    // 3) Evita cadastrar a mesma validade para o mesmo produto na mesma loja.
    const { data: existente, error: existenteError } = await supabaseClient
      .from('validades')
      .select('id')
      .eq('produto_id', produto.id)
      .eq('loja_id', lojaId)
      .eq('validade', date)
      .limit(1)
      .maybeSingle();

    if(existenteError) throw new Error('Não foi possível verificar a validade: '+existenteError.message);
    if(existente){
      msg('Essa validade já foi cadastrada para este produto nesta loja.','err');
      if(saveBtn){ saveBtn.disabled=false; saveBtn.textContent='SALVAR PRODUTO'; }
      return;
    }

    // 4) Agora sim: grava a validade no Supabase.
    const { error: validadeError } = await supabaseClient
      .from('validades')
      .insert({
        produto_id: produto.id,
        loja_id: lojaId,
        validade: date,
        cadastrado_por: usuario.id
      });

    if(validadeError) throw new Error('Não foi possível salvar a validade: '+validadeError.message);

    // Mantém a foto local por enquanto; a migração das fotos será feita depois.
    const file=$('photo') && $('photo').files[0];
    if(file){
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const map=JSON.parse(localStorage.getItem(PHOTOS)||'{}');
          map[code]=reader.result;
          localStorage.setItem(PHOTOS,JSON.stringify(map));
        }catch(e){ console.warn('Foto não pôde ser salva:',e); }
        window.location.href='lista_valididades.html';
      };
      reader.onerror=()=>{ window.location.href='lista_valididades.html'; };
      reader.readAsDataURL(file);
      return;
    }

    window.location.href='lista_valididades.html';
  } catch(e) {
    console.error('ERRO AO SALVAR NO SUPABASE:',e);
    msg('Erro ao salvar: '+(e.message||'verifique as permissões da tabela.'),'err');
    const saveBtn=$('saveBtn');
    if(saveBtn){ saveBtn.disabled=false; saveBtn.textContent='SALVAR PRODUTO'; }
  }
}
function openFromUrl(){
  const codigo=new URLSearchParams(window.location.search).get('codigo');
  if(codigo) find(codigo); else window.location.href='leitor.html';
}
(async function iniciarTela(){
  try{
    await carregarContextoUsuario();
    openFromUrl();
  }catch(e){
    console.error(e);
    msg('Não foi possível carregar os dados do usuário.','err');
  }
})();


/* ===== Microinterações de clique ===== */
(function(){
  document.addEventListener('click', function(e){
    const target = e.target.closest('button, .fab');
    if(!target) return;
    const rect = target.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * .45;
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    target.appendChild(ripple);
    setTimeout(()=>ripple.remove(), 520);
  }, true);

  document.querySelectorAll('input').forEach(function(input){
    input.addEventListener('focus', function(){ this.classList.add('pop-in'); });
  });
})();
