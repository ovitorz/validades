<script>
const SUPABASE_URL = 'https://siuvsahkjfyzdcrskleg.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
  'sb_publishable_At--bKaS3ZiZA0dmyN5FIQ_5WF735Nl';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

/* =========================================================
   SESSÃO
========================================================= */

let sessionUserPromise=null;

async function getSessionAndUser(){
  if(sessionUserPromise) return sessionUserPromise;

  sessionUserPromise=(async()=>{
    const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();

    if(sessionError){
      console.error('Erro ao verificar sessão:',sessionError);
      window.location.replace('login.html');
      return null;
    }
    if(!sessionData.session){
      window.location.replace('login.html');
      return null;
    }

    const authUser=sessionData.session.user;
    const {data:usuario,error:usuarioError}=await supabaseClient
      .from('usuarios')
      .select('id,auth_user_id,loja_id,perfil,nome,ativo')
      .eq('auth_user_id',authUser.id)
      .maybeSingle();

    if(usuarioError){
      console.error('Erro ao buscar usuário:',usuarioError);
      alert('Não foi possível identificar seu usuário.');
      return null;
    }
    if(!usuario){
      alert('Usuário não encontrado na tabela usuarios.');
      return null;
    }
    if(usuario.ativo === false){
      alert('Seu usuário está inativo.');
      await supabaseClient.auth.signOut();
      window.location.replace('login.html');
      return null;
    }
    if(usuario.perfil !== 'admin_global' && !usuario.loja_id){
      alert('Seu usuário ainda não possui uma loja vinculada.');
      return null;
    }

    return {session:sessionData.session,authUser,usuario};
  })();

  return sessionUserPromise;
}


/* =========================================================
   CONTA / LOJA
========================================================= */

async function carregarConta(){

  const emailEl = document.getElementById('accountEmail');
  const storeEl = document.getElementById('accountStore');

  const dados = await getSessionAndUser();

  if(!dados){
    return;
  }

  emailEl.textContent =
    dados.authUser.email || 'E-mail não informado';

  const perfilLabel = {
    funcionario:'Funcionário',
    gerente:'Gerente',
    gerente_geral:'Gerente geral',
    admin_global:'Administrador global'
  }[dados.usuario.perfil] || 'Usuário';

  if(dados.usuario.perfil === 'admin_global'){
    storeEl.textContent = `Acesso: ${perfilLabel} • Todas as lojas`;
    return;
  }

  const {
    data: loja,
    error: lojaError
  } = await supabaseClient
    .from('lojas')
    .select('nome')
    .eq('id', dados.usuario.loja_id)
    .maybeSingle();

  if(lojaError){
    console.error('Erro ao buscar loja:', lojaError);
    storeEl.textContent = `Acesso: ${perfilLabel} • Loja não identificada`;
    return;
  }

  storeEl.textContent =
    loja?.nome
      ? `Acesso: ${perfilLabel} • Loja: ${loja.nome}`
      : `Acesso: ${perfilLabel} • Loja não identificada`;
}


/* =========================================================

document.getElementById('logoutBtn').addEventListener(

/* =========================================================
   CONFIGURAÇÕES LOCAIS
========================================================= */

const PHOTOS = 'fotos_produtos_v2';

let photoMap = {};

try{
  photoMap =
    JSON.parse(
      localStorage.getItem(PHOTOS) || '{}'
    );
}catch(e){
  photoMap = {};
}


/* =========================================================
   DADOS
========================================================= */

let records = [];

let selectedRecordId = null;

let currentLojaId = null;
let currentPerfil = null;
let currentUsuarioId = null;
let stores = [];
let employees = [];


/* =========================================================
   NORMALIZAÇÃO
========================================================= */

function normalizeCode(value){

  return String(value ?? '')
    .replace(/\D/g,'');

}


/* =========================================================
   PRODUTO
========================================================= */

function getProductName(record){

  return (
    record.nome ||
    record.produto_nome ||
    'Produto sem nome'
  );

}


/* =========================================================
   FOTO
========================================================= */

function getPhoto(record){

  const code =
    normalizeCode(record.codigo);

  return (
    record.foto_url ||
    record.foto ||
    photoMap[record.codigo] ||
    photoMap[code] ||
    ''
  );

}


/* =========================================================
   DATAS
========================================================= */

function parseLocalDate(value){

  if(!value){
    return null;
  }

  const parts =
    String(value)
      .split('-')
      .map(Number);

  if(
    parts.length !== 3 ||
    parts.some(Number.isNaN)
  ){
    return null;
  }

  return new Date(
    parts[0],
    parts[1] - 1,
    parts[2]
  );

}


function daysUntil(value){

  const d =
    parseLocalDate(value);

  if(!d){
    return null;
  }

  const today = new Date();

  today.setHours(0,0,0,0);

  d.setHours(0,0,0,0);

  return Math.round(
    (d - today) / 86400000
  );

}


function formatDate(value){

  const d =
    parseLocalDate(value);

  if(!d){
    return value || 'Data não informada';
  }

  return d.toLocaleDateString(
    'pt-BR',
    {
      day:'2-digit',
      month:'2-digit',
      year:'numeric'
    }
  );

}


/* =========================================================
   STATUS
========================================================= */

function statusFor(days){

  if(days === null){

    return {
      kind:'normal',
      label:'—'
    };

  }

  if(days < 0){

    return {
      kind:'expired',
      label:'VENCIDO'
    };

  }

  if(days <= 10){

    return {
      kind:'warning',
      label:'ATENÇÃO'
    };

  }

  return {
    kind:'normal',
    label:'OK'
  };

}


function daysText(days){

  if(days === null){
    return '';
  }

  if(days < 0){

    const n =
      Math.abs(days);

    return n === 1
      ? 'Vencido há 1 dia'
      : `Vencido há ${n} dias`;

  }

  if(days === 0){
    return 'Vence hoje';
  }

  if(days === 1){
    return 'Falta 1 dia';
  }

  return `Faltam ${days} dias`;

}


/* =========================================================
   LOJA
========================================================= */

function getStore(record){

  return (
    record.loja ||
    record.lojaNome ||
    record.store ||
    record.estabelecimento ||
    record.loja_nome ||
    ''
  );

}


/* =========================================================
   BUSCAR VALIDADES NO SUPABASE
========================================================= */

async function carregarValidades(){

  const list = document.getElementById('list');
  const summary = document.getElementById('summary');

  list.innerHTML = `
    <div class="empty">
      <div class="empty-icon">◌</div>
      <strong>Carregando...</strong>
      <span>Buscando as validades cadastradas.</span>
    </div>
  `;

  const dados = await getSessionAndUser();
  if(!dados) return;

  currentLojaId = dados.usuario.loja_id;
  currentPerfil = dados.usuario.perfil;
  currentUsuarioId = dados.usuario.id;

  configurarAcesso(dados);

  // O RLS do Supabase decide quais validades o usuário realmente pode ver.
  // Por isso não filtramos loja_id aqui: gerente_geral e admin_global precisam
  // conseguir receber registros de todas as lojas.
  const { data, error } = await supabaseClient
    .from('validades')
    .select(`
      id,
      validade,
      produto_id,
      loja_id,
      cadastrado_por,
      produtos (
        id,
        codigo_barras,
        nome,
        foto_url,
        ativo
      )
    `)
    .order('validade', {ascending:true});

  if(error){
    console.error('Erro ao carregar validades:',error);
    summary.textContent = '';
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠</div>
        <strong>Não foi possível carregar as validades</strong>
        <span>${escapeHtml(error.message || 'Erro desconhecido')}</span>
      </div>
    `;
    return;
  }

  // Busca os nomes usados nos filtros. São consultas separadas para não
  // depender de relacionamentos FK configurados no Supabase.
  const [lojasResult, usuariosResult] = await Promise.all([
    supabaseClient.from('lojas').select('id,nome,ativo').order('nome'),
    supabaseClient.from('usuarios').select('id,nome,email,loja_id,perfil,ativo').order('nome')
  ]);

  stores = !lojasResult.error ? (lojasResult.data || []) : [];
  employees = !usuariosResult.error ? (usuariosResult.data || []) : [];

  if(lojasResult.error) console.warn('Não foi possível carregar lojas para o filtro:',lojasResult.error);
  if(usuariosResult.error) console.warn('Não foi possível carregar funcionários para o filtro:',usuariosResult.error);

  preencherFiltros();

  const storeMap = new Map(stores.map(s => [String(s.id), s.nome || `Loja ${s.id}`]));
  const employeeMap = new Map(employees.map(u => [
    String(u.id),
    u.nome || u.email || `Usuário ${u.id}`
  ]));

  records=(data || []).map(row=>{
    const produto=row.produtos || {};
    const codigo=produto.codigo_barras || '';
    const nome=produto.nome || 'Produto sem nome';
    const validade=row.validade || null;
    const days=daysUntil(validade);

    return {
      id:row.id,
      produto_id:row.produto_id,
      loja_id:row.loja_id,
      cadastrado_por:row.cadastrado_por,
      validade,
      codigo,
      nome,
      foto_url:produto.foto_url || '',
      loja_nome:storeMap.get(String(row.loja_id)) || '',
      cadastrado_por_nome:employeeMap.get(String(row.cadastrado_por)) || '',
      _search:(nome+' '+codigo).toLowerCase(),
      _days:days,
      _date:formatDate(validade),
      _status:statusFor(days)
    };
  });

  render();
}


/* =========================================================
   ACESSO / FILTROS
========================================================= */

function nomePerfil(perfil){
  return {
    funcionario:'Funcionário',
    gerente:'Gerente',
    gerente_geral:'Gerente geral',
    admin_global:'Administrador global'

function configurarAcesso(dados){
  const filtersWrap=document.getElementById('filtersWrap');
  const storeRow=document.getElementById('storeFilterRow');
  const employeeRow=document.getElementById('employeeFilterRow');
  const badge=document.getElementById('accessBadge');
  const dashboardBtn=document.getElementById('dashboardBtn');

function matches(record,term){

function openRecord(record){

function openRecordById(id){

  const record =
    records.find(
      r => String(r.id) === String(id)
    );

  }

function closeRecordModal(){

  selectedRecordId = null;

  document.getElementById(
    'editModal'
  ).classList.remove('open');

/* =========================================================
   EDITAR VALIDADE
========================================================= */

async function saveEditedDate(){

  if(!selectedRecordId){
    return;
  }

  const newDate =
    document.getElementById(
      'modalDate'
    ).value;

  if(!newDate){

    alert(
      'Informe uma data de validade.'
    );

    return;
  }


  const current =
    records.find(
      r =>
        String(r.id) ===
        String(selectedRecordId)
    );

  if(!current){

    closeRecordModal();

    return;
  }


  const duplicate =
    records.some(
      r =>
        String(r.id) !==
          String(current.id) &&
        String(r.produto_id) ===
          String(current.produto_id) &&
        r.validade === newDate
    );


  if(duplicate){

    alert(
      'Essa validade já está cadastrada para este produto.'
    );

    return;
  }


  const {
    error
  } = await supabaseClient
    .from('validades')
    .update({
      validade:newDate
    })
    .eq(
      'id',
      current.id
    )
    .eq(
      'loja_id',
      current.loja_id
    );


  if(error){

    console.error(
      'Erro ao editar validade:',
      error
    );

    alert(
      'Não foi possível salvar a alteração.\n\n' +
      error.message
    );

    return;
  }


  current.validade=newDate;
  current._days=daysUntil(newDate);
  current._date=formatDate(newDate);
  current._status=statusFor(current._days);

  closeRecordModal();

  render();

}


/* =========================================================
   EXCLUIR VALIDADE
========================================================= */

async function deleteRecord(){

  if(!selectedRecordId){
    return;
  }

  const record =
    records.find(
      r =>
        String(r.id) ===
        String(selectedRecordId)
    );

  if(!record){

    closeRecordModal();

    return;
  }


  if(
    !confirm(
      `Excluir a validade de ${getProductName(record)}?`
    )
  ){

    return;
  }


  const {
    error
  } = await supabaseClient
    .from('validades')
    .delete()
    .eq(
      'id',
      record.id
    )
    .eq(
      'loja_id',
      record.loja_id
    );


  if(error){

    console.error(
      'Erro ao excluir validade:',
      error
    );

    alert(
      'Não foi possível excluir o registro.\n\n' +
      error.message
    );

    return;
  }


  records =
    records.filter(
      r =>
        String(r.id) !==
        String(record.id)
    );


  closeRecordModal();

  render();

}


/* =========================================================
   RENDER
========================================================= */

function render(){
  const list=document.getElementById('list');
  const summary=document.getElementById('summary');
  const term=document.getElementById('searchInput').value.trim().toLowerCase();

  const data=records
    .filter(r=>matchesAccess(r))
    .filter(r=>matches(r,term))
    .slice()
    .sort((a,b)=>{
      const da=a._days, db=b._days;
      if(da===null) return 1;
      if(db===null) return -1;
      return da-db;
    });

  summary.textContent=term
    ? `${data.length} ${data.length===1?'registro encontrado':'registros encontrados'}`
    : `${data.length} ${data.length===1?'registro':'registros'}`;

  if(!data.length){
    list.innerHTML=`<div class="empty">
      <div class="empty-icon">◌</div>
      <strong>Nenhuma validade cadastrada</strong>
      <span>As validades adicionadas no cadastro aparecerão aqui.</span>
    </div>`;
    return;
  }

  list.innerHTML=data.map(record=>{
    const days=record._days;
    const st=record._status;
    const img=getPhoto(record);
    const store=record.loja_nome || getStore(record);

    return `<article class="item" role="button" tabindex="0" data-record-id="${escapeHtml(record.id)}">
      <div class="photo">${img
        ? `<img src="${escapeHtml(img)}" alt="" loading="lazy" decoding="async">`
        : `<span>□</span>`}</div>
      <div class="info">
        <div class="topline">
          <div class="date">${record._date}</div>
          <div class="status ${st.kind}">${st.label}</div>
        </div>
        <div class="name">${escapeHtml(record.nome)}</div>
        <div class="code">${escapeHtml(record.codigo || '')}</div>
        ${store && (currentPerfil==='gerente_geral' || currentPerfil==='admin_global') ? `<div class="store">Loja: ${escapeHtml(store)}</div>` : ''}
        ${(currentPerfil==='gerente' || currentPerfil==='gerente_geral' || currentPerfil==='admin_global') && record.cadastrado_por_nome ? `<div class="store">Cadastrado por: ${escapeHtml(record.cadastrado_por_nome)}</div>` : ''}
        ${days!==null ? `<div class="days ${st.kind}">${daysText(days)}</div>` : ''}
      </div>
    </article>`;
  }).join('');
}


// Um único listener para toda a lista, em vez de criar handlers em cada item.
document.getElementById('list').addEventListener('click',e=>{
  const item=e.target.closest('.item[data-record-id]');
  if(item) openRecordById(item.dataset.recordId);
});
document.getElementById('list').addEventListener('keydown',e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const item=e.target.closest('.item[data-record-id]');
  if(!item) return;
  e.preventDefault();
  openRecordById(item.dataset.recordId);
});


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}
